<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive CV of Dmitry Tolmachev, Research Fellow at Aalto University: molecular simulation of soft and biological materials.">
<title>Dmitry Tolmachev</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@1,600&family=Caveat:wght@600&family=Bebas+Neue&family=Lora:ital@0;1&family=Orbitron:wght@500&display=swap">
<style>
/* Layout: one full-screen "molecule" — circles are atoms, links are bonds. Root atom at centre, six branch atoms around it.
   Clicking an atom grows it and releases its children; clicking a leaf grows a card out of the circle. Pan and zoom freely. */
:root{
  --bg:#eef3f3; --panel:#ffffff; --fg:#14201f; --muted:#5c6b6a; --line:#c3d0ce; --scrim:rgba(10,20,19,.28);
  --c:#2a9bab; --o:#d8423a; --ion:#2f4fc4; --cell:#3fa34d; --silk:#c2348f; --mineral:#b07a1c; --drop:#e3f1f2; --land:#d3dddc;
  --b-sci:#1f8796; --b-man:#b5701a; --b-skl:#3a56c9; --b-tea:#6f58c9; --b-hob:#c2348f; --b-biz:#c7402f; --b-edu:#2d8a5a;
  --accent:#1f7f8c; --shadow:0 24px 60px rgba(20,32,31,.22);
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1413; --panel:#15201e; --fg:#e4eeec; --muted:#93a4a2; --line:#2e3f3c; --scrim:rgba(0,0,0,.5);
  --c:#4fc3d2; --o:#ff6b5f; --ion:#7d95ff; --cell:#62c46f; --silk:#ea6cbc; --mineral:#e0a849; --drop:#1d3133; --land:#2c4446;
  --b-sci:#4fc3d2; --b-man:#e0a849; --b-skl:#8299ff; --b-tea:#a893ff; --b-hob:#ea6cbc; --b-biz:#ff7a68; --b-edu:#6fd19a;
  --accent:#5ccad6; --shadow:0 24px 60px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1413; --panel:#15201e; --fg:#e4eeec; --muted:#93a4a2; --line:#2e3f3c; --scrim:rgba(0,0,0,.5);
  --c:#4fc3d2; --o:#ff6b5f; --ion:#7d95ff; --cell:#62c46f; --silk:#ea6cbc; --mineral:#e0a849; --drop:#1d3133; --land:#2c4446;
  --b-sci:#4fc3d2; --b-man:#e0a849; --b-skl:#8299ff; --b-tea:#a893ff; --b-hob:#ea6cbc; --b-biz:#ff7a68; --b-edu:#6fd19a;
  --accent:#5ccad6; --shadow:0 24px 60px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);margin:0;overflow:hidden}
header{position:absolute;top:0;left:0;right:0;z-index:2;pointer-events:none;padding-block:16px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
header>*{pointer-events:auto}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
h1{font:700 clamp(22px,3.6vw,34px)/1.05 var(--display);margin:6px 0 4px;letter-spacing:-.01em}
.role{color:var(--muted);font-size:13px;margin:0;max-width:52ch}
.links{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.links a{font:500 12px var(--mono);color:var(--fg);text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 10px}
.links a:hover{border-color:var(--accent);color:var(--accent)}
svg#map{position:relative;z-index:1;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#bgw{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;user-select:none}
#bgw span{position:absolute;white-space:nowrap;color:var(--muted);opacity:.1;line-height:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #bgw span{opacity:.13}}
:root[data-theme="dark"] #bgw span{opacity:.13}
@media (prefers-reduced-motion:no-preference){#bgw span{animation:bgf 22s ease-in-out infinite alternate}}
@keyframes bgf{to{translate:0 -10px}}
svg#map:active{cursor:grabbing}
.link{stroke:var(--line);stroke-width:2;stroke-linecap:round}
.node{cursor:pointer}
.node:focus{outline:none}
.node .halo{fill:var(--panel);stroke-width:2.2;transition:stroke-width .2s}
.node:hover .halo,.node:focus-visible .halo{stroke-width:4}
.node{transition:opacity .4s}
.node.dim{opacity:.38}
.link.dim{opacity:.35}
.node .glow{fill:none;stroke-width:10;opacity:0;transition:opacity .3s}
.node.open .glow{opacity:.18}
.node .lbl{fill:var(--fg);font:500 12px var(--body);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.node.d0 .lbl{font:700 17px var(--display)}
.node.d1 .lbl{font:700 15px var(--display)}
.node.d2 .lbl{font:600 13px var(--body)}
.node .me{font:700 18px var(--display);fill:var(--accent);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.node .mono{font:700 24px var(--display);fill:var(--panel)}
.node .yr{font:600 9px var(--mono);fill:var(--panel);pointer-events:none}
.node .pm{font:700 12px var(--mono);pointer-events:none}
.node .guess{fill:var(--panel);stroke:var(--mineral);stroke-width:1.5}
.node .guesst{font:700 10px var(--mono);fill:var(--mineral);pointer-events:none}
/* caption */
.cap{position:absolute;z-index:3;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.08);transition:opacity .25s}
.cap .k{font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cap h3{font:700 16px/1.2 var(--display);margin:3px 0 4px}
.cap p{margin:0;font-size:13px;color:var(--muted)}
.cap button{margin-top:8px}
.tools{position:absolute;z-index:3;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-direction:column;align-items:flex-end}
button.tb{font:500 13px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
button.tb:hover{border-color:var(--accent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{font:500 11px var(--mono);color:var(--muted);text-align:right;max-width:200px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px dashed var(--mineral);vertical-align:-2px;margin-right:4px}
@media (max-width:640px){header{background:linear-gradient(var(--bg) 78%,transparent);padding-bottom:14px}.cap p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.cap{padding:10px 12px;bottom:calc(64px + env(safe-area-inset-bottom,0px))}.legend{display:none}.tools{flex-direction:row}.role{font-size:12px}}
/* card */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:5;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.stage{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:16px}
.card{pointer-events:auto;width:min(600px,100%);max-height:calc(100% - 16px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px 22px 20px;position:relative}
.card .inner{animation:none}
.card .meta{font:500 12px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.tag.acc{border-color:var(--accent);color:var(--accent)}
.tag.guess{border:1.5px dashed var(--mineral);color:var(--mineral)}
.card h2{font:700 21px/1.2 var(--display);margin:10px 0 8px;text-wrap:balance;padding-right:36px}
.card h4{font:600 12px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.card p{margin:0 0 10px}
.card .lead{font-size:16px}
.card .muted{color:var(--muted);font-size:13px}
.card a{color:var(--accent)}
.card figure{margin:4px 0 0}
.card figure.sketch{margin:14px auto 0;max-width:300px;opacity:.9}
.sketch svg{width:100%;height:auto;display:block;overflow:visible}
.sketch path,.sketch circle,.sketch rect,.sketch ellipse,.sketch polygon{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sketch .a{stroke:var(--accent)}.sketch .dash{stroke-dasharray:5 5}
.sketch .f{fill:var(--panel);stroke:var(--muted)}.sketch .fa{fill:var(--accent);stroke:var(--accent)}
.sketch text{fill:var(--muted);stroke:none;font-family:Caveat,var(--body);font-weight:600}.sketch .ta{fill:var(--accent)}
.card img{width:100%;border-radius:10px;background:#fff;border:1px solid var(--line);display:block}
.card figcaption{font-size:11px;color:var(--muted);margin-top:4px}
.gal.lab3 figure{margin:0}.gal.lab3 .wide{grid-column:1/-1}.gal.lab3 img{height:220px;object-fit:cover}.gal.lab3 .wide img{height:auto;aspect-ratio:900/334;object-fit:cover}
.card figure.ph img{max-height:300px;width:auto;max-width:100%;margin:0 auto;display:block;border-radius:10px}
.card ul{margin:0 0 10px;padding-left:18px}
.card li{margin:3px 0}
.close{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:18px;line-height:1;cursor:pointer;z-index:1}
.stats{display:flex;flex-wrap:wrap;gap:18px 26px;margin:8px 0 12px;font-variant-numeric:tabular-nums}
.stats b{display:block;font:700 24px/1 var(--display)}
.stats span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{font:500 12px var(--body);color:var(--fg);background:var(--drop);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent)}
.tl{list-style:none;padding:0;margin:0 0 10px;border-left:2px solid var(--line)}
.tl li{padding:0 0 8px 14px;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.tl b{font:600 12px var(--mono);color:var(--muted);display:block}
.bar{height:8px;border-radius:4px;background:var(--drop);overflow:hidden;margin:2px 0 8px}
.bar i{display:block;height:100%;background:var(--b-man)}
.gal img[src*="vocal-stage"]{object-position:82% 40%}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gal img{aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.geomap{position:relative;border-radius:12px;overflow:hidden;background:var(--drop);margin:6px 0 8px;touch-action:none}
.geomap svg{width:100%;height:auto;display:block;cursor:grab}
.geomap path.cty{stroke:var(--panel);stroke-width:.5}
.geomap path.cty.on{cursor:pointer}
.geomap path.arc{fill:none;stroke-width:1.5;opacity:.8;pointer-events:none}
.geomap g.city{cursor:pointer}
.geomap g.city circle{stroke:var(--panel);stroke-width:1}
.geomap g.city text{font:500 9px var(--mono);fill:var(--fg);paint-order:stroke;stroke:var(--drop);stroke-width:2.5px;pointer-events:none}
.geomap g.city text.minor{display:none}
.geomap.zoomed g.city text.minor{display:inline}
.geomap .mapbtns{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.geomap .mapbtns button{font:600 12px var(--mono);min-width:28px;height:28px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.geomap .maptip{position:absolute;max-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;line-height:1.35;box-shadow:var(--shadow);pointer-events:none;z-index:2}
.mapinfo ul{margin:4px 0 8px;padding-left:18px}
.geo svg{width:100%;height:auto;display:block;background:var(--drop);border-radius:10px}
.geo text{font:500 9px var(--mono);fill:var(--muted)}
@media (prefers-reduced-motion:reduce){.scrim,.cap{transition:none}}
.cap[hidden]{display:none}
</style>

<header>
  <div>
    <div class="eyebrow">Interactive CV</div>
    <h1>Dmitry Tolmachev</h1>
    <p class="role">Research Fellow at Aalto University. Molecular simulation of soft and biological materials, from bone-like composites to spider silk and ferrofluids.</p>
  </div>
  <nav class="links" aria-label="Profiles">
    <a href="https://scholar.google.com/citations?user=OQtj-R4AAAAJ" target="_blank" rel="noopener">Scholar</a>
    <a href="https://orcid.org/0000-0002-9699-100X" target="_blank" rel="noopener">ORCID</a>
    <a href="https://www.linkedin.com/in/dmitry-tolmachev-158806254/" target="_blank" rel="noopener">LinkedIn</a>
    <a href="mailto:tolmach.dm@gmail.com" title="tolmach.dm@gmail.com">Email</a>
  </nav>
</header>

<div id="bgw" aria-hidden="true"></div>
<svg id="map" role="img" aria-label="Diagram of connected circles: Dmitry's CV"></svg>

<div class="cap" id="cap" aria-live="polite"></div>
<div class="tools">
  <button class="tb" id="resetBtn" type="button">Reset view</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="stage" id="stage" hidden><article class="card" id="card" role="dialog" aria-modal="true"><button class="close" id="closeBtn" type="button" aria-label="Close">×</button><div class="inner" id="cardBody"></div></article></div>
